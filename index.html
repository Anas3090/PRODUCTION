<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Production Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Production Dashboard</h1>
    <a href="add.html" class="btn">Add Data</a>
  </header>

  <main>
    <table id="dashboard">
      <thead>
        <tr>
          <th>WORK DATE</th>
          <th>CO-186</th>
          <th>CO-252</th>
          <th>210</th>
          <th>18626</th>
          <th>ANTHEM</th>
          <th>HUMANA</th>
          <th>UHC</th>
          <th>ROI</th>
          <th>TOTAL</th>
          <th>STATUS</th>
          <th>PERCENT</th>
        </tr>
      </thead>
      <tbody id="dataRows"></tbody>
      <tfoot>
        <tr>
          <td colspan="9" style="text-align:right;"><strong>WD - 21 DAYS</strong></td>
          <td id="totalSum"></td>
          <td></td>
          <td id="avgPercent"></td>
        </tr>
      </tfoot>
    </table>
  </main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyALgzflHBREiKYAhy0HEcZR19gd1CJMBEQ",
    authDomain: "production-sheet-b5c65.firebaseapp.com",
    databaseURL: "https://production-sheet-b5c65-default-rtdb.firebaseio.com",
    projectId: "production-sheet-b5c65",
    storageBucket: "production-sheet-b5c65.appspot.com",
    messagingSenderId: "1088797956054",
    appId: "1:1088797956054:web:1f5397850eac7ad40f3677"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  async function loadData() {
    const dbRef = ref(db);
    try {
      const snapshot = await get(child(dbRef, 'productionData'));
      if (snapshot.exists()) {
        const data = snapshot.val();
        const tableBody = document.getElementById("dataRows");
        tableBody.innerHTML = "";

        Object.values(data).forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.workDate}</td>
            <td>${row.co186}</td>
            <td>${row.co252}</td>
            <td>${row.c210}</td>
            <td>${row.c18626}</td>
            <td>${row.wrokdate}</td>
            <td>${row.humana}</td>
            <td>${row.uhc}</td>
            <td>${row.roi}</td>
            <td>${row.total}</td>
            <td>${row.status}</td>
            <td>${row.percent}</td>
          `;
          tableBody.appendChild(tr);
        });
      }
    } catch (error) {
      console.error("Error loading data:", error);
    }
  }

  loadData();
</script>
  
  <footer>
    <p>© 2026 Production Tracker</p>
  </footer>
</body>
</html>
